<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3dsciencezone</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #e7efe8;
        color: #14211c;
        font-family: "Nirmala UI", "Hind Siliguri", sans-serif;
      }
      main {
        max-width: 28rem;
        margin: 2rem;
        padding: 2rem;
        background: #f8f4ec;
        border-radius: 1.5rem;
      }
      a {
        color: #8d3f22;
      }
      code {
        font-family: ui-monospace, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>3dsciencezone</h1>
      <p>সাইটটা এখন Next.js-এ চলে। এই ফাইলটা ডাবল-ক্লিক করলে পুরনো পাতা আর আসবে না।</p>
      <p>ফোল্ডারে টার্মিনাল খুলে লিখো:</p>
      <p><code>npm run dev</code></p>
      <p>তারপর ব্রাউজারে খোলো <a href="http://localhost:3000">http://localhost:3000</a></p>
    </main>
  </body>
</html>
